services:
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: dashboard
    ports:
      - "3000:80"
    depends_on:
      - control-panel
    restart: unless-stopped

  control-panel:
    build:
      context: .
      dockerfile: control-panel/Dockerfile
    container_name: control-panel
    ports:
      - "9001:9001"
    environment:
      APP_URL: 0.0.0.0:9001
      NATS_URL: nats://nats:4222
      MONGO_URI: mongodb://admin:admin@mongo:27017/?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
      EDGE_SERVICE_TOKEN: ${EDGE_SERVICE_TOKEN:-local-edge-service-token}
    depends_on:
      - nats
      - mongo
    restart: unless-stopped

  edge:
    build:
      context: .
      dockerfile: edge/Dockerfile
    container_name: edge
    ports:
      - "8080:8080"
      - "8090:8090"
    environment:
      APP_CACHE_URL: 0.0.0.0:8080
      APP_INTERNAL_URL: 0.0.0.0:8090
      CONTROL_PANEL_URL: http://control-panel:9001
      NATS_URL: nats://nats:4222
      EDGE_SERVICE_TOKEN: ${EDGE_SERVICE_TOKEN:-local-edge-service-token}
    depends_on:
      - control-panel
      - nats
    volumes:
      - edge_cache:/root/cache
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    depends_on:
      - edge
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.1
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  # origin:
  #   build:
  #     context: .
  #     dockerfile: origin-sample/Dockerfile
  #   container_name: origin
  #   ports:
  #     - "8081:8081"
  #   restart: unless-stopped

  nats:
    image: nats
    container_name: nats_broker
    ports:
      - "4222:4222"
      - "8222:8222"
    restart: unless-stopped

  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
  edge_cache:
  prometheus_data:
  grafana_data:
